<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke="hsl(43 70% 65%)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <radialGradient id="bt-ember" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(43 95% 78%)" stop-opacity="1"/>
      <stop offset="60%" stop-color="hsl(28 85% 55%)" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="hsl(20 60% 30%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bt-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="hsl(48 100% 80%)" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="hsl(43 90% 60%)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outer ember halo -->
  <circle cx="60" cy="60" r="50" fill="url(#bt-ember)" opacity="0.5"/>
  <!-- the mouth: parted lips -->
  <path d="M28 64 Q60 50 92 64 Q60 78 28 64 Z" opacity="0.85"/>
  <path d="M30 64 Q60 56 90 64" opacity="0.7"/>
  <!-- the tongue, rising and forking into flame -->
  <path d="M52 62 Q54 50 58 38 Q62 28 60 18 Q58 28 62 38 Q66 50 68 62 Z" fill="hsl(28 80% 45% / 0.25)" opacity="0.9"/>
  <path d="M52 62 Q54 50 58 38 Q62 28 60 18"/>
  <path d="M68 62 Q66 50 62 38 Q58 28 60 18"/>
  <!-- inner tongue line -->
  <path d="M60 60 L60 30" opacity="0.55"/>
  <!-- surrounding ember flecks -->
  <circle cx="22" cy="58" r="2.2" fill="hsl(28 85% 55%)" opacity="0.7"/>
  <circle cx="98" cy="58" r="2.2" fill="hsl(28 85% 55%)" opacity="0.7"/>
  <circle cx="34" cy="44" r="1.6" fill="hsl(43 90% 70%)" opacity="0.6"/>
  <circle cx="86" cy="44" r="1.6" fill="hsl(43 90% 70%)" opacity="0.6"/>
  <circle cx="44" cy="34" r="1.4" fill="hsl(28 80% 55%)" opacity="0.55"/>
  <circle cx="76" cy="34" r="1.4" fill="hsl(28 80% 55%)" opacity="0.55"/>
  <circle cx="28" cy="74" r="1.8" fill="hsl(28 75% 50%)" opacity="0.55"/>
  <circle cx="92" cy="74" r="1.8" fill="hsl(28 75% 50%)" opacity="0.55"/>
  <!-- the brighter ember at the tongue's tip -->
  <circle cx="60" cy="18" r="9" fill="url(#bt-glow)"/>
  <circle cx="60" cy="18" r="3" fill="hsl(48 100% 88%)" stroke="hsl(48 100% 80%)" stroke-width="0.6"/>
</svg>
