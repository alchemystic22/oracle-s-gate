<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gold5f" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e0b258"/>
      <stop offset="1" stop-color="#7a5a1f"/>
    </linearGradient>
    <linearGradient id="cloth5f" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#221a14"/>
      <stop offset="1" stop-color="#0a0808"/>
    </linearGradient>
    <radialGradient id="lantern5f" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.6" stop-color="#caa14a"/>
      <stop offset="1" stop-color="#5a3a14" stop-opacity="0.95"/>
    </radialGradient>
  </defs>

  <!-- lantern (faint glow under cloth) -->
  <g transform="translate(72 80)">
    <ellipse cx="28" cy="36" rx="20" ry="28" fill="url(#lantern5f)" opacity="0.55"/>
    <rect x="14" y="14" width="28" height="42" rx="3" fill="none" stroke="url(#gold5f)" stroke-width="0.7" opacity="0.7"/>
    <line x1="14" y1="28" x2="42" y2="28" stroke="url(#gold5f)" stroke-width="0.4" opacity="0.6"/>
    <line x1="14" y1="42" x2="42" y2="42" stroke="url(#gold5f)" stroke-width="0.4" opacity="0.6"/>
    <line x1="28" y1="14" x2="28" y2="56" stroke="url(#gold5f)" stroke-width="0.3" opacity="0.5"/>
    <!-- top cap and hanging ring -->
    <path d="M 18 14 L 38 14 L 34 8 L 22 8 Z" fill="none" stroke="url(#gold5f)" stroke-width="0.7"/>
    <path d="M 26 8 Q 28 2 30 8" fill="none" stroke="url(#gold5f)" stroke-width="0.6"/>
    <!-- base -->
    <rect x="12" y="56" width="32" height="4" fill="none" stroke="url(#gold5f)" stroke-width="0.6"/>
  </g>

  <!-- dark cloth covering the lantern, draped with one narrow opening -->
  <path d="M 38 70 Q 100 50 162 70 Q 168 110 152 154 Q 100 168 48 154 Q 32 110 38 70 Z"
        fill="url(#cloth5f)" stroke="#3a2a18" stroke-width="0.6" opacity="0.95"/>
  <!-- cloth folds -->
  <path d="M 56 80 Q 60 120 64 152" stroke="#5a3a20" stroke-width="0.4" opacity="0.6" fill="none"/>
  <path d="M 138 80 Q 140 120 138 152" stroke="#5a3a20" stroke-width="0.4" opacity="0.6" fill="none"/>
  <path d="M 80 70 Q 80 110 76 150" stroke="#4a3216" stroke-width="0.3" opacity="0.5" fill="none"/>
  <path d="M 120 70 Q 122 110 124 150" stroke="#4a3216" stroke-width="0.3" opacity="0.5" fill="none"/>

  <!-- narrow opening on the right shoulder of the cloth -->
  <path d="M 116 80 Q 124 96 130 110 Q 124 96 116 80 Z" fill="#0a0808"/>

  <!-- single gold ray escaping through the opening -->
  <path d="M 122 92 L 178 50" stroke="url(#gold5f)" stroke-width="1.8" stroke-linecap="round" opacity="0.95"/>
  <path d="M 122 92 L 178 50" stroke="#fff2c8" stroke-width="0.5" stroke-linecap="round" opacity="0.8"/>
  <!-- ray dust -->
  <g fill="#f4c46a">
    <circle cx="138" cy="80" r="0.7" opacity="0.85"/>
    <circle cx="152" cy="68" r="0.6" opacity="0.7"/>
    <circle cx="166" cy="58" r="0.5" opacity="0.6"/>
  </g>

  <!-- thin frame -->
  <rect x="14" y="14" width="172" height="172" rx="3" fill="none" stroke="url(#gold5f)" stroke-width="0.4" opacity="0.45"/>
</svg>
