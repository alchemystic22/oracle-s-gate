<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gold5u" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e0b258"/>
      <stop offset="1" stop-color="#7a5a1f"/>
    </linearGradient>
    <linearGradient id="emberFlame5u" x1="0.5" x2="0.5" y1="1" y2="0">
      <stop offset="0" stop-color="#c46a1c"/>
      <stop offset="1" stop-color="#f4c46a"/>
    </linearGradient>
    <radialGradient id="darkField5u" cx="0.5" cy="0.65" r="0.6">
      <stop offset="0" stop-color="#1a140c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#06060a" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- darkened field below the sentence -->
  <ellipse cx="100" cy="138" rx="86" ry="44" fill="url(#darkField5u)" opacity="0.85"/>

  <!-- closed mouth (left side) — engraved line-pair -->
  <g transform="translate(28 96)" stroke="url(#gold5u)" stroke-linecap="round" fill="none">
    <path d="M 0 6 Q 10 0 22 6" stroke-width="1.4"/>
    <path d="M 0 6 Q 10 12 22 6" stroke-width="1.0" opacity="0.75"/>
    <line x1="-4" y1="6" x2="-1" y2="6" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- suspended sentence — single horizontal stroke with engraved word ticks -->
  <line x1="52" y1="102" x2="178" y2="102" stroke="url(#gold5u)" stroke-width="0.7" opacity="0.95"/>
  <g stroke="url(#gold5u)" stroke-linecap="round">
    <line x1="56" y1="98" x2="64" y2="98" stroke-width="1.6"/>
    <line x1="70" y1="98" x2="84" y2="98" stroke-width="1.3"/>
    <line x1="90" y1="98" x2="98" y2="98" stroke-width="1.3"/>
    <line x1="104" y1="98" x2="120" y2="98" stroke-width="1.3"/>
    <line x1="126" y1="98" x2="138" y2="98" stroke-width="1.3"/>
    <line x1="144" y1="98" x2="158" y2="98" stroke-width="1.3"/>
    <line x1="164" y1="98" x2="174" y2="98" stroke-width="1.3"/>
  </g>

  <!-- single flame touching the first word -->
  <g transform="translate(60 78)">
    <path d="M 0 18 Q -2 10 0 4 Q 3 -2 6 4 Q 8 9 4 14 Q 7 16 6 20 Z"
          fill="url(#emberFlame5u)" stroke="#b06820" stroke-width="0.4" opacity="0.95"/>
    <path d="M 1 18 Q 1 12 4 6" stroke="#fff2c8" stroke-width="0.5" opacity="0.7" fill="none"/>
  </g>

  <!-- faint dust between sentence and field -->
  <g fill="#cfa14a" opacity="0.45">
    <circle cx="76" cy="120" r="0.6"/>
    <circle cx="108" cy="124" r="0.5"/>
    <circle cx="140" cy="118" r="0.6"/>
    <circle cx="160" cy="126" r="0.5"/>
  </g>

  <!-- thin frame -->
  <rect x="14" y="14" width="172" height="172" rx="3" fill="none" stroke="url(#gold5u)" stroke-width="0.4" opacity="0.45"/>
</svg>
