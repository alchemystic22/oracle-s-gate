<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="gold4d" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d4a64a"/>
      <stop offset="1" stop-color="#7a5a1f"/>
    </linearGradient>
    <linearGradient id="silver4d" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#7a7d85"/>
      <stop offset="1" stop-color="#3a3c43"/>
    </linearGradient>
    <radialGradient id="mirror4d" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#1a1620" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#06060a" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Dark mirror behind -->
  <ellipse cx="100" cy="100" rx="78" ry="84" fill="url(#mirror4d)" stroke="#8a6a2a" stroke-width="1.2" opacity="0.95"/>
  <ellipse cx="100" cy="100" rx="74" ry="80" fill="none" stroke="#b08838" stroke-width="0.5" opacity="0.6"/>

  <!-- Faint reflective geometry -->
  <path d="M 40 100 Q 100 70 160 100" stroke="#cfa14a" stroke-width="0.3" opacity="0.35" fill="none"/>
  <path d="M 40 100 Q 100 130 160 100" stroke="#cfa14a" stroke-width="0.3" opacity="0.35" fill="none"/>

  <!-- Silver nameplate (shadowed, behind) -->
  <g transform="translate(78 88) rotate(-6)">
    <rect x="0" y="0" width="78" height="34" rx="2" fill="url(#silver4d)" stroke="#9aa0a8" stroke-width="0.8" opacity="0.85"/>
    <line x1="6" y1="17" x2="72" y2="17" stroke="#1a1c20" stroke-width="0.4" opacity="0.6"/>
    <line x1="6" y1="11" x2="48" y2="11" stroke="#1a1c20" stroke-width="0.3" opacity="0.4"/>
    <line x1="6" y1="23" x2="56" y2="23" stroke="#1a1c20" stroke-width="0.3" opacity="0.4"/>
  </g>

  <!-- Gold nameplate (polished, front, overlapping) -->
  <g transform="translate(54 100) rotate(4)">
    <rect x="0" y="0" width="82" height="36" rx="2" fill="url(#gold4d)" stroke="#e6c270" stroke-width="0.9"/>
    <rect x="2" y="2" width="78" height="32" rx="1.2" fill="none" stroke="#fff1c2" stroke-width="0.3" opacity="0.55"/>
    <line x1="8" y1="18" x2="74" y2="18" stroke="#3a2a08" stroke-width="0.5" opacity="0.7"/>
    <line x1="8" y1="11" x2="52" y2="11" stroke="#3a2a08" stroke-width="0.35" opacity="0.55"/>
    <line x1="8" y1="25" x2="60" y2="25" stroke="#3a2a08" stroke-width="0.35" opacity="0.55"/>
  </g>

  <!-- Single red thread binding both -->
  <path d="M 50 80 C 70 96, 130 124, 162 140"
        stroke="#a8202a" stroke-width="1.1" fill="none" opacity="0.95"
        stroke-linecap="round"/>
  <circle cx="50" cy="80" r="1.4" fill="#a8202a"/>
  <circle cx="162" cy="140" r="1.4" fill="#a8202a"/>
</svg>
